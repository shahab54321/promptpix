<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptPix — AI Photo Prompts</title>
<style>
:root{--bg:#0b1120;--panel:#111c30;--panel2:#17243a;--text:#f4f7ff;--muted:#9caec9;--blue:#3b82f6;--line:#263650}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1120,#111a2c 55%,#080e19);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
header{padding:22px 18px 14px;max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:900;letter-spacing:-.7px}.brand span{color:#60a5fa}.sub{color:var(--muted);font-size:13px;margin-top:3px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:10px 13px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:8px 16px 100px}.hero{background:linear-gradient(120deg,#17386d,#1d4e91 60%,#172b4c);padding:22px;border-radius:20px;margin:10px 0 18px;border:1px solid #2c5285}.hero h1{font-size:26px;margin:0 0 7px}.hero p{margin:0;color:#d1e3ff;font-size:14px}.search{margin:16px 0;display:flex;gap:8px}.search input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:white;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 13px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--panel);color:#b7c6dc;cursor:pointer;font-size:13px}.chip.active{background:var(--blue);border-color:var(--blue);color:white}.sectionrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px}.sectionrow h2{margin:0;font-size:19px}.sectionrow small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.thumb{height:190px;background:linear-gradient(135deg,#1d3558,#274d83);display:flex;align-items:center;justify-content:center;color:#b9d4f9;font-size:42px;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.cardbody{padding:13px}.cardtitle{font-size:15px;font-weight:750;margin:0 0 6px}.cardmeta{color:var(--muted);font-size:12px;margin-bottom:10px}.prompt{font-size:12px;color:#c4d2e5;line-height:1.5;max-height:74px;overflow:auto;background:#0b1425;padding:9px;border-radius:10px}.actions{display:flex;gap:8px;margin-top:11px}.copy{flex:1;background:var(--blue);color:white;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}.fav{background:#23334d;border:1px solid #344a68;color:white;border-radius:10px;padding:9px 12px;cursor:pointer}.fav.on{color:#ff77a8}.empty{color:var(--muted);padding:30px 10px;text-align:center;grid-column:1/-1}.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:white;border:0;border-radius:15px;padding:14px 20px;box-shadow:0 8px 30px #0008;cursor:pointer;font-weight:750;white-space:nowrap}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);padding:19px;border-radius:18px;max-height:90vh;overflow:auto}.modalbox h2{margin:0 0 14px}.modalbox label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}.modalbox input,.modalbox textarea,.modalbox select{width:100%;padding:11px;border-radius:10px;background:#0b1425;color:white;border:1px solid var(--line)}.modalbox textarea{min-height:100px;resize:vertical}.modalactions{display:flex;gap:8px;margin-top:15px}.modalactions button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);cursor:pointer}.save{background:var(--blue);color:white;border:0!important}.cancel{background:#22324a;color:white}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#19345c;padding:10px 16px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.thumb{height:220px}} 
</style></head><body>
<header><div><div class="brand">Prompt<span>Pix</span> ✦</div><div class="sub">AI Photo Editing Prompts</div></div><button class="iconbtn" id="favTab">♡ Favorites</button></header>
<main><section class="hero"><h1>Discover your next photo style</h1><p>Copy a prompt, paste it into your AI photo editor, and create your look.</p></section>
<div class="search"><input id="search" placeholder="Search prompts or styles…"></div><div class="filters" id="filters"></div>
<div class="sectionrow"><h2 id="sectionTitle">Trending Prompts</h2><small id="count"></small></div><div class="grid" id="grid"></div></main>
<button class="fab" id="addBtn" type="button" onclick="openPromptModal()">＋ Upload New Prompt</button><div class="toast" id="toast">Prompt copied!</div>
<div class="modal" id="modal"><div class="modalbox"><h2>Add a Prompt</h2><label>Style name</label><input id="newTitle" placeholder="e.g. Soft Blue Glow"><label>Category</label><select id="newCat"><option>Glow</option><option>DSLR</option><option>Cinematic</option><option>Nature</option><option>Portrait</option><option>Islamic</option><option>Other</option></select><label>Photo (optional)</label><input id="newImg" type="file" accept="image/*"><label>Editing prompt</label><textarea id="newPrompt" placeholder="Paste your AI photo editing prompt here…"></textarea><div class="modalactions"><button class="cancel" id="closeModal">Cancel</button><button class="save" id="savePrompt">Save Prompt</button></div></div></div>
<script>
const starter=[
 {title:'Soft Blue Glow',cat:'Glow',prompt:'Enhance this photo with a soft blue cinematic glow, gentle cool highlights, natural skin texture, subtle background blur, realistic lighting, sharp details, premium DSLR portrait quality. Keep the subject’s identity, face, clothing, and proportions unchanged.'},
 {title:'DSLR Portrait',cat:'DSLR',prompt:'Make this photo look like a professional DSLR portrait with crisp natural details, soft depth of field, balanced light, realistic colors, clean background bokeh, and high resolution. Preserve the exact face and identity.'},
 {title:'Golden Hour',cat:'Nature',prompt:'Create a warm golden-hour look with soft sunlight, delicate shadows, natural color grading, realistic skin texture, dreamy background blur, and professional photography quality. Do not alter the subject’s identity or features.'},
 {title:'Cinematic Moody',cat:'Cinematic',prompt:'Give this photo a cinematic moody aesthetic with dramatic but natural lighting, rich contrast, subtle film grain, deep shadows, balanced highlights, realistic details, and a premium movie still look. Keep face and identity exactly the same.'}
];
let items=JSON.parse(localStorage.getItem('promptpix-items')||'null')||starter;let favorites=JSON.parse(localStorage.getItem('promptpix-favs')||'[]');let active='All',favMode=false;
const cats=['All','DSLR','Glow','Cinematic','Nature','Portrait','Islamic','Other'];const filters=document.getElementById('filters');cats.forEach(c=>{let b=document.createElement('button');b.className='chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;favMode=false;document.getElementById('favTab').textContent='♡ Favorites';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent===c));render()};filters.appendChild(b)});
function persist(){localStorage.setItem('promptpix-items',JSON.stringify(items));localStorage.setItem('promptpix-favs',JSON.stringify(favorites))}
function render(){let q=document.getElementById('search').value.trim().toLowerCase();let shown=items.filter(x=>(active==='All'||x.cat===active)&&(!favMode||favorites.includes(x.id))&&(!q||(x.title+' '+x.cat+' '+x.prompt).toLowerCase().includes(q));document.getElementById('sectionTitle').textContent=favMode?'Your Favorites':active==='All'?'Trending Prompts':active+' Prompts';document.getElementById('count').textContent=shown.length+' styles';let grid=document.getElementById('grid');grid.innerHTML='';if(!shown.length){grid.innerHTML='<div class="empty">No prompts found. Try another search or category.</div>';return}shown.forEach((x,i)=>{let card=document.createElement('article');card.className='card';let thumb=document.createElement('div');thumb.className='thumb';if(x.img){let im=document.createElement('img');im.src=x.img;thumb.appendChild(im)}else thumb.textContent=['✧','◈','☼','✦'][i%4];let body=document.createElement('div');body.className='cardbody';body.innerHTML=`<h3 class="cardtitle"></h3><div class="cardmeta"></div><div class="prompt"></div><div class="actions"><button class="copy">Copy Prompt</button><button class="fav" title="Favorite">♡</button></div>`;body.querySelector('.cardtitle').textContent=x.title;body.querySelector('.cardmeta').textContent=x.cat+' · AI Photo Style';body.querySelector('.prompt').textContent=x.prompt;let cp=body.querySelector('.copy');cp.onclick=async()=>{try{await navigator.clipboard.writeText(x.prompt)}catch(e){let t=document.createElement('textarea');t.value=x.prompt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}let toast=document.getElementById('toast');toast.textContent='Prompt copied!';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)};let fb=body.querySelector('.fav');fb.classList.toggle('on',favorites.includes(x.id));fb.textContent=favorites.includes(x.id)?'♥':'♡';fb.onclick=()=>{favorites.includes(x.id)?favorites=favorites.filter(v=>v!==x.id):favorites.push(x.id);persist();render()};card.append(thumb,body);grid.appendChild(card)})}
document.getElementById('search').addEventListener('input',render);document.getElementById('favTab').onclick=()=>{favMode=!favMode;active='All';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==='All'));document.getElementById('favTab').textContent=favMode?'♥ Favorites':'♡ Favorites';render()};const modal=document.getElementById('modal');function openPromptModal(){modal.classList.add('show');modal.style.display='flex';document.getElementById('newTitle').focus()}window.openPromptModal=openPromptModal;document.getElementById('addBtn').addEventListener('click',openPromptModal);document.getElementById('addBtn').addEventListener('touchend',function(e){e.preventDefault();openPromptModal();},{passive:false});document.getElementById('closeModal').onclick=()=>{modal.classList.remove('show');modal.style.display='none'};modal.onclick=e=>{if(e.target===modal){modal.classList.remove('show');modal.style.display='none'}};document.getElementById('savePrompt').onclick=()=>{let title=document.getElementById('newTitle').value.trim(),prompt=document.getElementById('newPrompt').value.trim(),cat=document.getElementById('newCat').value,file=document.getElementById('newImg').files[0];if(!title||!prompt){alert('Please enter a style name and prompt.');return}let entry={id:'p'+Date.now(),title,cat,prompt};if(file){entry.img=URL.createObjectURL(file)}items.unshift(entry);persist();document.getElementById('newTitle').value='';document.getElementById('newPrompt').value='';document.getElementById('newImg').value='';modal.classList.remove('show');active='All';favMode=false;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent==='All'));render()};render();
</script></body></html>
