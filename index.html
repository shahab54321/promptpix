
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptPix</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:white;font-family:Arial}
header{padding:20px;background:#171d34;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;color:#a99aff;font-weight:bold}
main{max-width:1100px;margin:auto;padding:22px}
button{background:#7865ee;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer;font-weight:bold}
input,textarea,select{width:100%;padding:13px;margin:8px 0;background:#171d34;color:white;border:1px solid #414968;border-radius:9px}
textarea{min-height:110px}
.panel{background:#191f37;padding:18px;border-radius:12px;margin:20px 0}
.hidden{display:none}
.hero{text-align:center;padding:30px 0}
.hero h1{font-size:36px}
.search{max-width:600px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#191f37;border-radius:12px;overflow:hidden}
.card img{width:100%;height:190px;object-fit:cover}
.content{padding:15px}
.prompt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.copy{width:100%;margin-top:12px}
.category{color:#a99aff;font-size:13px}
.status{color:#b8b0ff}
footer{text-align:center;padding:30px;color:#aaa}
</style>
</head>
<body>
<header>
<div class="logo">✦ PromptPix</div>
<button id="loginToggle">Admin Login</button>
</header>

<main>
<section class="hero">
<h1>Discover Amazing AI Prompts</h1>
<p>Explore, copy and create with AI prompts.</p>
<input class="search" id="search" placeholder="Search prompts...">
</section>

<section class="panel hidden" id="loginPanel">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="logoutBtn" class="hidden">Logout</button>
<p class="status" id="loginStatus"></p>
</section>

<section class="panel hidden" id="uploadPanel">
<h2>Upload New Prompt</h2>
<input id="title" placeholder="Prompt title">
<select id="category">
<option>General</option>
<option>Photography</option>
<option>Art</option>
<option>Anime</option>
<option>3D</option>
<option>Logo</option>
<option>Other</option>
</select>
<label>Select Image</label>
<input id="image" type="file" accept="image/*">
<textarea id="prompt" placeholder="Write your AI prompt here"></textarea>
<button id="uploadBtn">Upload Prompt</button>
<p class="status" id="uploadStatus"></p>
</section>

<h2>Latest Prompts</h2>
<div class="grid" id="gallery"></div>
<p class="status" id="pageStatus"></p>
</main>

<footer>© 2026 PromptPix</footer>

<script>
const URL="https://vtivyyuykgofulnypypp.supabase.co";
const KEY="sb_publishable_-_Ie1GcR6MBxMuFy_8iwag_3oqRQZjo";
const db=window.supabase.createClient(URL,KEY);
const BUCKET="prompt-images";
const $=id=>document.getElementById(id);

function msg(id,text){$(id).textContent=text}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function updateLogin(){
 const {data}=await db.auth.getSession();
 const logged=!!data.session;
 $("uploadPanel").classList.toggle("hidden",!logged);
 $("logoutBtn").classList.toggle("hidden",!logged);
 $("loginBtn").classList.toggle("hidden",logged);
 $("loginToggle").textContent=logged?"Admin Panel":"Admin Login";
}

$("loginToggle").onclick=()=>{
 $("loginPanel").classList.toggle("hidden");
};

$("loginBtn").onclick=async()=>{
 msg("loginStatus","Logging in...");
 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){msg("loginStatus",error.message);return;}
 msg("loginStatus","Login successful!");
 await updateLogin();
};

$("logoutBtn").onclick=async()=>{
 await db.auth.signOut();
 await updateLogin();
 msg("loginStatus","Logged out.");
};

async function loadPrompts(){
 msg("pageStatus","Loading prompts...");
 const {data,error}=await db.from("prompts")
  .select("*").order("created_at",{ascending:false});

 if(error){msg("pageStatus",error.message);return;}

 $("gallery").innerHTML="";

 for(const item of (data||[])){
  let imageUrl="";

  if(item.image_url){
   const {data:signed,error:signError}=await db.storage
    .from(BUCKET).createSignedUrl(item.image_url,3600);

   if(!signError) imageUrl=signed.signedUrl;
   else console.error("Image URL error:",signError);
  }

  const card=document.createElement("div");
  card.className="card";
  card.dataset.search=(item.title+" "+item.category+" "+item.prompt_text).toLowerCase();

  card.innerHTML=`
   ${imageUrl?`<img src="${safe(imageUrl)}" alt="Prompt image">`:""}
   <div class="content">
    <div class="category">${safe(item.category)}</div>
    <h3>${safe(item.title)}</h3>
    <div class="prompt">${safe(item.prompt_text)}</div>
    <button class="copy">Copy Prompt</button>
   </div>`;

  card.querySelector(".copy").onclick=async()=>{
   try{
    await navigator.clipboard.writeText(item.prompt_text);
    card.querySelector(".copy").textContent="Copied!";
   }catch(e){alert("Copy failed");}
  };

  $("gallery").appendChild(card);
 }

 msg("pageStatus",data.length?"":"No prompts uploaded yet.");
}

$("search").oninput=()=>{
 const term=$("search").value.toLowerCase();
 document.querySelectorAll(".card").forEach(card=>{
  card.style.display=card.dataset.search.includes(term)?"":"none";
 });
};

$("uploadBtn").onclick=async()=>{
 const {data:sessionData}=await db.auth.getSession();
 if(!sessionData.session){
  msg("uploadStatus","Please login first.");return;
 }

 const title=$("title").value.trim();
 const promptText=$("prompt").value.trim();
 const category=$("category").value;
 const file=$("image").files[0];

 if(!title||!promptText){
  msg("uploadStatus","Enter title and prompt.");return;
 }

 if(!file){
  msg("uploadStatus","Please select an image.");return;
 }

 if(!file.type.startsWith("image/")){
  msg("uploadStatus","Please select a valid image.");return;
 }

 msg("uploadStatus","Uploading image...");

 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const imagePath=Date.now()+"-"+safeName;

 const {data:uploaded,error:imageError}=await db.storage
  .from(BUCKET)
  .upload(imagePath,file,{upsert:false});

 if(imageError){
  msg("uploadStatus","Image upload error: "+imageError.message);
  console.error(imageError);
  return;
 }

 if(!uploaded||!uploaded.path){
  msg("uploadStatus","Image upload did not return a file path.");
  return;
 }

 msg("uploadStatus","Image uploaded. Saving prompt...");

 const {error}=await db.from("prompts").insert({
  title:title,
  prompt_text:promptText,
  category:category,
  image_url:uploaded.path
 });

 if(error){
  msg("uploadStatus","Prompt save error: "+error.message);
  console.error(error);
  return;
 }

 $("title").value="";
 $("prompt").value="";
 $("image").value="";

 msg("uploadStatus","Prompt and image uploaded successfully!");
 await loadPrompts();
};

db.auth.onAuthStateChange(()=>{
 setTimeout(updateLogin,0);
});

updateLogin();
loadPrompts();
</script>
</body>
</html>
