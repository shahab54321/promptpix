<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptPix — AI Photo Prompts</title>
<style>
:root{--bg:#080d1b;--panel:#101a2d;--panel2:#14223a;--text:#eef4ff;--muted:#9aaac5;--blue:#4c8dff;--line:#25344c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1326,#070b15 70%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:5;background:#0b1326eF;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px max(16px,calc((100vw - 1100px)/2))}.head{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:24px;font-weight:850;letter-spacing:.3px}.brand span{color:#70a6ff}.tag{color:var(--muted);font-size:12px;margin-top:2px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn:active{transform:scale(.98)}main{max-width:1100px;margin:auto;padding:22px 16px 50px}.hero{padding:22px 4px 18px}.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text)}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:30px;padding:8px 13px;cursor:pointer}.chip.active{background:#214a88;border-color:#4c8dff;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px}.preview{height:190px;background:#17243b;display:flex;align-items:center;justify-content:center;color:#7f91ad;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:40px}.cardbody{padding:14px}.meta{color:#83afff;font-size:12px;margin-bottom:6px}.card h3{font-size:17px;margin:0 0 9px}.prompt{color:#c3cee0;font-size:13px;line-height:1.5;max-height:84px;overflow:auto}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:9px;border-radius:9px}.fav{max-width:46px}.empty{text-align:center;padding:50px 10px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--line);font-size:12px}dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;width:min(560px,calc(100% - 24px));padding:0}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}.modalhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:19px}.modalform{padding:18px;display:grid;gap:12px}.modalform label{display:grid;gap:6px;color:var(--muted);font-size:13px}.modalform input,.modalform select,.modalform textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0a1324;color:var(--text);padding:11px}.modalform textarea{min-height:100px;resize:vertical}.formbuttons{display:flex;gap:9px;justify-content:flex-end}.smallnote{font-size:12px;color:var(--muted)}@media(max-width:500px){.head{align-items:flex-start}.brand{font-size:21px}.head .btn{padding:10px 11px}.preview{height:165px}}
</style></head>
<body>
<header><div class="head"><div><div class="brand">Prompt<span>Pix</span> ✦</div><div class="tag">AI photo editing prompts, ready to copy</div></div><button class="btn" id="addBtn">＋ Upload Prompt</button></div></header>
<main><section class="hero"><h1>Discover your next photo style ✨</h1><p>Explore prompts, copy them, and create amazing AI edits.</p></section>
<div class="tools"><input class="search" id="search" placeholder="🔎 Search prompts…"><button class="btn secondary" id="favOnly">♡ Favorites</button></div><div class="chips" id="chips"></div><section class="grid" id="grid"></section><div class="empty" id="empty" hidden>No prompts found. Add your first prompt!</div></main>
<footer>PromptPix · Prompt inspiration for your AI edits</footer>
<dialog id="modal"><div class="modalhead"><h2>Add a Prompt</h2><button class="btn secondary" id="closeBtn">✕</button></div><form class="modalform" id="form"><label>Prompt title<input id="title" placeholder="e.g. Soft Blue Glow" required></label><label>Category<select id="category"><option>DSLR</option><option>Glow</option><option>Cinematic</option><option>Nature</option><option>Portrait</option><option>Islamic</option><option>Other</option></select></label><label>AI prompt<textarea id="promptText" placeholder="Paste your photo editing prompt here…" required></textarea></label><label>Image (optional)<input type="file" id="imageFile" accept="image/*"></label><div class="smallnote">Saved on this browser/device for this demo.</div><div class="formbuttons"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" type="submit">Save Prompt</button></div></form></dialog>
<script>
const starter=[{id:'s1',title:'Soft Blue Glow',category:'Glow',prompt:'Enhance the photo with a soft blue cinematic glow, gentle cool highlights, natural skin texture, balanced contrast, and a clean professional look. Preserve the subject identity and original details.',emoji:'🌌'},{id:'s2',title:'DSLR Portrait',category:'DSLR',prompt:'Transform this photo into a professional DSLR portrait. Use crisp natural details, realistic skin texture, soft background blur, flattering light, and subtle color grading. Keep the face and identity unchanged.',emoji:'📷'},{id:'s3',title:'Golden Hour',category:'Nature',prompt:'Create a warm golden-hour atmosphere with soft sunlight, natural shadows, rich but realistic colors, and a peaceful outdoor background. Keep the subject realistic and unchanged.',emoji:'🌅'},{id:'s4',title:'Cinematic Look',category:'Cinematic',prompt:'Give this image a cinematic movie-still look with moody lighting, subtle film grain, rich contrast, tasteful color grading, and realistic detail. Preserve the original subject and composition.',emoji:'🎬'}];
let items=JSON.parse(localStorage.getItem('promptpix-items')||'null')||starter;let favorites=JSON.parse(localStorage.getItem('promptpix-favs')||'[]');let active='All',onlyFav=false;
const grid=document.getElementById('grid'),chips=document.getElementById('chips'),empty=document.getElementById('empty');function save(){localStorage.setItem('promptpix-items',JSON.stringify(items));localStorage.setItem('promptpix-favs',JSON.stringify(favorites))}function cats(){let c=['All',...new Set(items.map(x=>x.category))];chips.innerHTML=c.map(x=>`<button class="chip ${active===x?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){cats();let q=document.getElementById('search').value.toLowerCase();let list=items.filter(x=>(active==='All'||x.category===active)&&(!onlyFav||favorites.includes(x.id))&&(x.title.toLowerCase().includes(q)||x.prompt.toLowerCase().includes(q)||x.category.toLowerCase().includes(q));grid.innerHTML=list.map(x=>`<article class="card"><div class="preview">${x.image?`<img src="${x.image}" alt="${esc(x.title)}">`:`<span class="placeholder">${x.emoji||'✨'}</span>`}</div><div class="cardbody"><div class="meta">${esc(x.category)}</div><h3>${esc(x.title)}</h3><div class="prompt">${esc(x.prompt)}</div><div class="actions"><button class="btn" data-copy="${esc(x.id)}">Copy Prompt</button><button class="btn secondary fav" data-fav="${esc(x.id)}">${favorites.includes(x.id)?'♥':'♡'}</button></div></div></article>`).join('');empty.hidden=list.length>0;grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{let x=items.find(z=>z.id===b.dataset.copy);try{await navigator.clipboard.writeText(x.prompt);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy Prompt',1400)}catch(e){prompt('Copy this prompt:',x.prompt)}});grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;favorites.includes(id)?favorites=favorites.filter(a=>a!==id):favorites.push(id);save();render()})}
document.getElementById('search').addEventListener('input',render);document.getElementById('favOnly').onclick=()=>{onlyFav=!onlyFav;document.getElementById('favOnly').textContent=onlyFav?'♥ Favorites':'♡ Favorites';render()};const modal=document.getElementById('modal');document.getElementById('addBtn').onclick=()=>modal.showModal();['closeBtn','cancelBtn'].forEach(id=>document.getElementById(id).onclick=()=>modal.close());document.getElementById('form').onsubmit=async e=>{e.preventDefault();let image='';let file=document.getElementById('imageFile').files[0];if(file){image=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}items.unshift({id:'p'+Date.now(),title:document.getElementById('title').value.trim(),category:document.getElementById('category').value,prompt:document.getElementById('promptText').value.trim(),image,emoji:'✨'});save();render();e.target.reset();modal.close()};render();
</script></body></html>
